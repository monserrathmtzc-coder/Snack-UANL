<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snacks UANL</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --vino:#3b0002;
    --vino2:#550005;
    --rojo:#9d1717;
    --gris:#d8d8d8;
    --grisClaro:#f3f3f3;
    --blanco:#ffffff;
    --negro:#111111;
    --estrella:#b22222;
}

body{
    background:#1e1e1e;
    font-family:Arial,sans-serif;
    color:var(--negro);
}

#app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    margin:auto;
    background:white;
    overflow:hidden;
}

.header{
    height:140px;
    background:var(--vino);
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.logo{
    font-family:"Times New Roman",serif;
    font-size:27px;
    cursor:pointer;
}

.decoracion{
    height:100%;
    display:flex;
    gap:12px;
}

.decoracion span{
    width:37px;
    height:120px;
    display:block;
    background:#ddd;
}

.pantalla{
    min-height:calc(100vh - 140px);
    padding:28px 22px 95px;
    background:white;
}

.pregunta{
    font-family:Georgia,serif;
    font-style:italic;
    font-size:25px;
    margin:5px 10px 30px;
}

.busqueda{
    width:100%;
    height:50px;
    border:0;
    outline:none;
    border-radius:15px;
    background:var(--gris);
    padding:0 18px;
    margin-bottom:15px;
}

.titulo-grande{
    font-family:Georgia,serif;
    font-size:36px;
    margin:14px 0 25px;
}

.categorias{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:0 30px;
}

.categoria{
    height:60px;
    background:var(--vino);
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:white;
    padding:0 20px;
    cursor:pointer;
    transition:.2s;
}

.categoria:hover{
    transform:scale(1.02);
    background:var(--vino2);
}

.categoria-nombre{
    font-family:Georgia,serif;
    font-style:italic;
    font-size:31px;
}

.icono-categoria{
    width:43px;
    height:43px;
    border-radius:10px;
    background:#88000b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.boton-mapa{
    margin-top:62px;
    width:100%;
    height:50px;
    background:var(--gris);
    border:0;
    border-radius:13px;
    font-family:Georgia,serif;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

.titulo-categoria{
    display:flex;
    align-items:center;
    gap:15px;
    font-family:Georgia,serif;
    font-style:italic;
    font-size:36px;
    margin-bottom:15px;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.tarjeta{
    background:var(--gris);
    border-radius:15px;
    min-height:110px;
    padding:12px 10px 12px 20px;
    display:grid;
    grid-template-columns:1fr 100px 35px;
    gap:10px;
    align-items:center;
}

.tarjeta h3{
    font-family:Georgia,serif;
    font-style:italic;
    font-size:21px;
    margin-bottom:5px;
}

.tarjeta p{
    font-family:Georgia,serif;
    font-style:italic;
    font-size:12px;
    margin:3px 0;
}

.tarjeta img{
    width:100px;
    height:90px;
    object-fit:cover;
    border-radius:4px;
}

.boton-flecha{
    width:32px;
    height:32px;
    border-radius:50%;
    border:3px solid #a31616;
    background:white;
    color:#a31616;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    cursor:pointer;
}

.detalle-imagen{
    width:100%;
    max-height:320px;
    object-fit:cover;
    margin-bottom:25px;
}

.detalle-titulo{
    font-family:Georgia,serif;
    font-style:italic;
    font-size:28px;
    margin-bottom:35px;
}

.detalle-info{
    line-height:1.5;
    margin-bottom:24px;
}

.horario{
    margin:28px 0;
}

.ubicacion{
    color:#9c1717;
    font-size:28px;
    margin-left:10px;
    cursor:pointer;
}

.seccion-calificacion{
    margin:25px 0;
    padding:15px;
    background:var(--grisClaro);
    border-radius:12px;
}

.texto-calificacion{
    margin-bottom:8px;
    font-weight:bold;
}

.estrellas{
    display:flex;
    gap:5px;
    font-size:34px;
}

.estrellas span{
    color:#cccccc;
    cursor:pointer;
    transition:.2s;
}

.estrellas span:hover{
    transform:scale(1.15);
}

.estrellas span.activa{
    color:var(--estrella);
}

.resultado-calificacion{
    margin-top:8px;
    font-size:14px;
    color:#555;
}

.promedio{
    margin-top:4px;
    font-size:13px;
    color:#777;
}

.boton-resena{
    width:100%;
    height:38px;
    border:0;
    border-radius:20px;
    background:var(--gris);
    padding:0 15px;
    font-family:Georgia,serif;
    font-style:italic;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.label-comentarios{
    display:block;
    margin:16px 0 5px;
}

.comentarios{
    width:100%;
    height:100px;
    border:0;
    outline:none;
    background:var(--gris);
    border-radius:5px;
    resize:none;
    padding:12px;
}

.comentario-item{
    background:#f1f1f1;
    border-radius:8px;
    padding:10px;
    margin-top:8px;
    font-size:13px;
}

.regresar{
    background:var(--vino);
    color:white;
    border:0;
    border-radius:25px;
    padding:13px 20px;
    font-family:Georgia,serif;
    font-style:italic;
    cursor:pointer;
    margin-top:35px;
    float:right;
}

.titulo-mapa{
    background:var(--gris);
    padding:8px 18px;
    border-radius:15px;
    font-family:Georgia,serif;
    font-size:27px;
    margin-bottom:30px;
}

.mapa{
    width:100%;
    height:500px;
    border:0;
}

.sin-resultados{
    text-align:center;
    color:#777;
    padding:30px;
}

@media(min-width:800px){

    body{
        padding:30px;
    }

    #app{
        box-shadow:0 0 35px rgba(0,0,0,.5);
    }
}

</style>

</head>

<body>

<div id="app">

<header class="header">

    <div class="logo" onclick="mostrarInicio()">
        SNACKS UANL
    </div>

    <div class="decoracion">
        <span></span>
        <span></span>
    </div>

</header>

<main id="contenido"></main>

</div>

<script>

const lugares = [

{
    id:1,
    nombre:"Snack FIME",
    categoria:"cafe",
    descripcion:"Snack + Bebidas",
    productos:"Papas, burritos, agua natural, cafés, jugos, panadería y snacks dulces",
    horario:"7:00 am - 9:30 pm",
    imagen:"img/snack-fime.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=FIME+UANL"
},

{
    id:2,
    nombre:"Tim Hortons FIME",
    categoria:"cafe",
    descripcion:"Bakery + Bebidas",
    productos:"Donas, timbits, cafés, smoothie y bebidas refrescantes",
    horario:"6:00 am - 10:00 pm",
    imagen:"img/tim-hortons.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=FIME+UANL"
},

{
    id:3,
    nombre:"Tim Hortons FARQ",
    categoria:"cafe",
    descripcion:"Bakery + Bebidas",
    productos:"Donas, timbits, cafés, smoothie y bebidas refrescantes",
    horario:"6:00 am - 10:00 pm",
    imagen:"img/tim-hortons.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=FARQ+UANL"
},

{
    id:4,
    nombre:"Chilaquiles FIC",
    categoria:"comida",
    descripcion:"Snack + Comida + Postres",
    productos:"Desayunos, comidas, bebidas, snacks y dulces",
    horario:"10:00 am - 8:00 pm",
    imagen:"img/chilaquiles.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=FIC+UANL"
},

{
    id:5,
    nombre:"Cafetería FIME",
    categoria:"comida",
    descripcion:"Bebidas + Comida",
    productos:"Desayunos, comidas y bebidas",
    horario:"7:00 am - 9:00 pm",
    imagen:"img/Cafeteria FIME.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=Cafeteria+FIME+UANL"
},

{
    id:6,
    nombre:"Otakos",
    categoria:"comida",
    descripcion:"Boneless + Papas + Bebidas",
    productos:"Boneless, papas y bebidas",
    horario:"11:00 am - 6:00 pm",
    imagen:"img/Otakos.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=Ciudad+Universitaria+UANL"
},

{
    id:7,
    nombre:"Hotchos FCFM",
    categoria:"comida",
    descripcion:"Hotdogs + Papas + Bebidas",
    productos:"Hotdogs, papas y bebidas",
    horario:"11:00 am - 6:00 pm",
    imagen:"img/Hotchos FCFM.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=FCFM+UANL"
},

{
    id:8,
    nombre:"Snack FOD",
    categoria:"bebidas",
    descripcion:"Snack + Comida + Aguas frescas",
    productos:"Comida, papas, bebidas, chips, Tostitos con elote y aguas frescas",
    horario:"10:00 am - 6:00 pm",
    imagen:"img/snack FOD.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=FOD+UANL"
},

{
    id:9,
    nombre:"Snack FACDYC",
    categoria:"bebidas",
    descripcion:"Comida + Bebida + Snack",
    productos:"Comida, papas, bebidas, chips, Tostitos con elote, aguas frescas y frappé",
    horario:"7:00 am - 8:00 pm",
    imagen:"img/sNACK facpdyc.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=FACDYC+UANL"
},

{
    id:10,
    nombre:"FARQ y FIME",
    categoria:"bebidas",
    descripcion:"Aguas frescas",
    productos:"Aguas frescas",
    horario:"11:00 am - 6:00 pm",
    imagen:"img/FARQ & FIME.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=Ciudad+Universitaria+UANL"
},

{
    id:11,
    nombre:"Boyos FIME",
    categoria:"snacks",
    descripcion:"Boyos",
    productos:"Boyos refrescantes",
    horario:"12:00 pm - 4:00 pm",
    imagen:"img/Boyos FIME.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=FIME+UANL"
},

{
    id:12,
    nombre:"Tosticientro",
    categoria:"snacks",
    descripcion:"Bebida + Snack",
    productos:"Tostitos con elote, elote en vaso, Coca-Cola de vidrio y bebidas",
    horario:"11:00 am - 8:00 pm",
    imagen:"img/Tosticientro.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=Ciudad+Universitaria+UANL"
},

{
    id:13,
    nombre:"Ringos",
    categoria:"snacks",
    descripcion:"Helados + Crepas + Smoothie",
    productos:"Helado, crepas, smoothie y sundae",
    horario:"10:00 am - 8:30 pm",
    imagen:"img/Ringos.png",
    mapa:"https://www.google.com/maps/search/?api=1&query=Ciudad+Universitaria+UANL"
}

];


const contenido = document.getElementById("contenido");


function mostrarInicio(){

contenido.innerHTML = `

<section class="pantalla">

<h2 class="pregunta">
¿Qué quieres comer hoy?
</h2>

<input
type="text"
id="buscador"
class="busqueda"
placeholder="Buscar cafeterías, snack o comida"
oninput="buscarLugar()"
>

<div id="resultadosBusqueda"></div>

<h1 class="titulo-grande">
Categorías
</h1>

<div class="categorias">

<div class="categoria"
onclick="mostrarCategoria('cafe')">

<span class="categoria-nombre">
Café...
</span>

<span class="icono-categoria">
☕
</span>

</div>


<div class="categoria"
onclick="mostrarCategoria('comida')">

<span class="categoria-nombre">
Comida...
</span>

<span class="icono-categoria">
🍔
</span>

</div>


<div class="categoria"
onclick="mostrarCategoria('bebidas')">

<span class="categoria-nombre">
Bebidas...
</span>

<span class="icono-categoria">
🥤
</span>

</div>


<div class="categoria"
onclick="mostrarCategoria('snacks')">

<span class="categoria-nombre">
Snacks...
</span>

<span class="icono-categoria">
🍪
</span>

</div>

</div>


<button
class="boton-mapa"
onclick="mostrarMapa()">

Mapa de UANL 📍

</button>

</section>

`;

}


function mostrarCategoria(categoria){

const filtrados =
lugares.filter(
lugar => lugar.categoria === categoria
);

const nombres = {
cafe:"Café",
comida:"Comida",
bebidas:"Bebidas",
snacks:"Snacks"
};

const iconos = {
cafe:"☕",
comida:"🍔",
bebidas:"🥤",
snacks:"🍪"
};

contenido.innerHTML = `

<section class="pantalla">

<div class="titulo-categoria">

${nombres[categoria]}

<span class="icono-categoria">
${iconos[categoria]}
</span>

</div>

<div class="lista">

${filtrados.map(lugar => tarjeta(lugar)).join("")}

</div>

<button
class="regresar"
onclick="mostrarInicio()">

Regresar a la página anterior

</button>

</section>

`;

}


function tarjeta(lugar){

const calificacion =
Number(
localStorage.getItem("calificacion_" + lugar.id)
) || 0;

let textoCalificacion = "";

if(calificacion > 0){
    textoCalificacion = `<p>★ ${calificacion}/5</p>`;
}

return `

<div class="tarjeta">

<div>

<h3>
${lugar.nombre}
</h3>

<p>
${lugar.descripcion}
</p>

<p>
Abierto ${lugar.horario}
</p>

${textoCalificacion}

</div>

<img
src="${lugar.imagen}"
alt="${lugar.nombre}"
onerror="this.src='https://placehold.co/200x150?text=Snack+UANL'"
>

<button
class="boton-flecha"
onclick="mostrarDetalle(${lugar.id})">

→

</button>

</div>

`;

}


function mostrarDetalle(id){

const lugar =
lugares.find(
lugar => lugar.id === id
);

const comentarios =
JSON.parse(
localStorage.getItem("comentarios_" + id)
) || [];

contenido.innerHTML = `

<section class="pantalla">

<img
class="detalle-imagen"
src="${lugar.imagen}"
alt="${lugar.nombre}"
onerror="this.src='https://placehold.co/500x350?text=Snack+UANL'"
>

<h1 class="detalle-titulo">
${lugar.nombre}
</h1>

<div class="detalle-info">

<p>
${lugar.descripcion}
</p>

<p>

<strong>
Encuentras:
</strong>

${lugar.productos}

</p>

</div>

<div class="horario">

Horario:
${lugar.horario}

<span
class="ubicacion"
onclick="abrirMapa('${lugar.mapa}')">

📍

</span>

</div>


<div class="seccion-calificacion">

<p class="texto-calificacion">
Califica este lugar:
</p>

<div class="estrellas" id="estrellas">

<span onclick="calificar(${lugar.id},1)">★</span>
<span onclick="calificar(${lugar.id},2)">★</span>
<span onclick="calificar(${lugar.id},3)">★</span>
<span onclick="calificar(${lugar.id},4)">★</span>
<span onclick="calificar(${lugar.id},5)">★</span>

</div>

<p
id="resultadoCalificacion"
class="resultado-calificacion">
</p>

</div>


<button
class="boton-resena"
onclick="guardarComentario(${lugar.id})">

Guardar reseña

<span>➜</span>

</button>

<label class="label-comentarios">
Comentarios
</label>

<textarea
class="comentarios"
id="comentarioTexto"
placeholder="Escribe tu reseña...">
</textarea>

<div>

${comentarios.map(
comentario =>
`
<div class="comentario-item">
${comentario}
</div>
`
).join("")}

</div>

<button
class="regresar"
onclick="mostrarCategoria('${lugar.categoria}')">

Regresar a la página anterior

</button>

</section>

`;

pintarEstrellas(id);

}


function calificar(id, valor){

localStorage.setItem(
"calificacion_" + id,
valor
);

pintarEstrellas(id);

}


function pintarEstrellas(id){

const calificacion =
Number(
localStorage.getItem(
"calificacion_" + id
)
) || 0;

const estrellas =
document.querySelectorAll(
"#estrellas span"
);

estrellas.forEach(
(estrella, indice) => {

if(indice < calificacion){

estrella.classList.add("activa");

}else{

estrella.classList.remove("activa");

}

}
);

const resultado =
document.getElementById(
"resultadoCalificacion"
);

if(resultado){

if(calificacion === 0){

resultado.textContent =
"Aún no has calificado este lugar.";

}else{

resultado.textContent =
"Tu calificación: " +
calificacion +
" de 5 estrellas";

}

}

}


function guardarComentario(id){

const caja =
document.getElementById("comentarioTexto");

const texto =
caja.value.trim();

if(texto === ""){

alert("Escribe un comentario antes de guardar.");

return;

}

let comentarios =
JSON.parse(
localStorage.getItem(
"comentarios_" + id
)
) || [];

comentarios.push(texto);

localStorage.setItem(
"comentarios_" + id,
JSON.stringify(comentarios)
);

mostrarDetalle(id);

}


function mostrarMapa(){

contenido.innerHTML = `

<section class="pantalla">

<div class="titulo-mapa">
Mapa de UANL
</div>

<iframe
class="mapa"
src="https://www.google.com/maps?q=Ciudad+Universitaria+UANL,+San+Nicolas+de+los+Garza,+Nuevo+Leon&output=embed"
loading="lazy">
</iframe>

<button
class="regresar"
onclick="mostrarInicio()">

Regresar a la página anterior

</button>

</section>

`;

}


function abrirMapa(url){

window.open(
url,
"_blank"
);

}


function buscarLugar(){

const texto =
document
.getElementById("buscador")
.value
.toLowerCase();

const contenedor =
document.getElementById(
"resultadosBusqueda"
);

if(texto.length < 2){

contenedor.innerHTML = "";

return;

}

const resultado =
lugares.filter(lugar =>

lugar.nombre
.toLowerCase()
.includes(texto)

||

lugar.descripcion
.toLowerCase()
.includes(texto)

||

lugar.productos
.toLowerCase()
.includes(texto)

);

if(resultado.length === 0){

contenedor.innerHTML = `

<div class="sin-resultados">

No encontramos resultados.

</div>

`;

return;

}

contenedor.innerHTML = `

<div class="lista">

${resultado.map(
lugar => tarjeta(lugar)
).join("")}

</div>

<br>

`;

}


mostrarInicio();

</script>

</body>

</html>
